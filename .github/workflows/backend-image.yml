# 백엔드 Docker 이미지를 빌드해 GHCR에 올린다. 테스트는 돌리지 않는다(로컬 ./gradlew test가 기준, CONTRIBUTING.md).
# 서버(RAM 1GiB)에서는 Gradle 빌드가 무거워 이미지만 받아 쓴다. 사용법은 docs/deploy.md.
name: backend-image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 이미지 이름은 소문자여야 한다.
          images: ghcr.io/${{ github.repository_owner }}/ku-hack-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
