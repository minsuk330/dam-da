# PR마다 바뀐 영역의 검사를 돌린다(#186). 실제 LLM을 부르는 liveTest·benchmark는 돌리지 않는다.
# main 반영 뒤의 백엔드 테스트는 backend-image가 이미지를 만들기 전에 돌린다.
name: checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      optimizer: ${{ steps.filter.outputs.optimizer }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - "frontend/openapi.json"
              - ".github/workflows/**"
            frontend:
              - "frontend/**"
              - ".github/workflows/**"
            optimizer:
              - "optimizer/**"
              - ".github/workflows/**"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
      # OpenApiSpecIT는 계약이 다르면 frontend/openapi.json을 다시 쓰고 실패한다. 커밋 누락을 한 번 더 막는다.
      - run: git diff --exit-code -- ../frontend/openapi.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web

  optimizer:
    needs: changes
    if: needs.changes.outputs.optimizer == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
