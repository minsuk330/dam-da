plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.khack'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// 커넥터 MCP OAuth 2.1(#96). 0.1.x는 Spring AI 2.0.x 전용. 자동 설정 없는 모듈만 쓰고 체인은 SecurityConfig에서 직접 짠다.
	implementation 'org.springaicommunity:mcp-server-security:0.1.14'
	implementation 'org.springaicommunity:mcp-authorization-server:0.1.14'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'com.microsoft.playwright:playwright:1.63.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'io.github.open-spaced-repetition:fsrs:1.0.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	// 실제 Jev·OpenAI를 부르는 @Tag("live") 테스트는 빼고, 키 없이 fake로 돈다.
	useJUnitPlatform {
		excludeTags 'live'
	}
	systemProperty 'spring.profiles.active', 'test'
}

// 실제 Jev·OpenAI 호출로 핵심 흐름을 검증한다. backend/.env의 키가 필요하고 비용이 든다. PR 전 수동 실행.
tasks.register('liveTest', Test) {
	description = 'Runs @Tag("live") tests against the real Jev and OpenAI APIs (needs keys in backend/.env).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'live'
	}
	// test 프로파일(H2, 키 비움) 위에 live 프로파일로 실제 키를 되살린다.
	systemProperty 'spring.profiles.active', 'test,live'
	outputs.upToDateWhen { false }
	shouldRunAfter tasks.named('test')
	// 키는 backend/.env(또는 -PenvFile=경로)에서 읽어 테스트 프로세스 환경에 넣는다. 값은 출력하지 않는다.
	doFirst {
		def envFile = file(project.findProperty('envFile') ?: '.env')
		if (envFile.exists()) {
			envFile.eachLine { line ->
				def trimmed = line.trim()
				if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
					def (key, value) = [trimmed.substring(0, trimmed.indexOf('=')).trim(), trimmed.substring(trimmed.indexOf('=') + 1).trim()]
					environment key, value
				}
			}
		}
	}
}

def cli = { String taskName, String main ->
	tasks.register(taskName, JavaExec) {
		group = 'verification cli'
		classpath = sourceSets.main.runtimeClasspath
		mainClass = main
		workingDir = projectDir
		args = ((project.findProperty('args') ?: '') as String).tokenize()
		// 저장된 대화를 읽을 서버 (tools/verify/SessionSource). 예: -Pserver=http://localhost:8081
		systemProperty 'review.server', (project.findProperty('server') ?: 'http://localhost:8080')
	}
}
cli('longScript', 'com.khack.review.tools.verify.LongScriptGenerator')
cli('connectorCheck', 'com.khack.review.tools.verify.ConnectorCheckCli')
cli('shareProbe', 'com.khack.review.tools.verify.ShareProbeCli')
cli('shareVerify', 'com.khack.review.tools.verify.ShareVerifyCli')
cli('sessionsMd', 'com.khack.review.tools.verify.SessionsMarkdownCli')
cli('benchmark', 'com.khack.review.tools.benchmark.BenchmarkCli')
cli('jevCheck', 'com.khack.review.tools.verify.JevCheckCli')
cli('unitReviewCheck', 'com.khack.review.tools.verify.UnitReviewCheckCli')
cli('questionGen', 'com.khack.review.tools.question.QuestionGenCli')
cli('extractCheck', 'com.khack.review.tools.verify.ExtractCheckCli')
cli('questionQualityCheck', 'com.khack.review.tools.verify.QuestionQualityCheckCli')
cli('answerJudgeCheck', 'com.khack.review.tools.verify.AnswerJudgeCheckCli')
cli('feedbackContentCheck', 'com.khack.review.tools.verify.FeedbackContentCheckCli')
cli('nextActionCheck', 'com.khack.review.tools.verify.NextActionCheckCli')
cli('sessionFieldCheck', 'com.khack.review.tools.verify.SessionFieldCheckCli')
