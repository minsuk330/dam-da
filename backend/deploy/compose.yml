# VPS 배포: Spring 앱 + PostgreSQL + Caddy(HTTPS). 사용법은 docs/deploy.md.
# 이 디렉터리에서 실행한다: docker compose up -d --build
name: khack

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-review}
      POSTGRES_USER: ${DB_USERNAME:-review}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 외부 포트를 열지 않는다. 앱만 내부 네트워크로 접속한다.

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-review}
      # 매일 학습의 "오늘"·연속 학습 일수·알림 시각은 JVM 기본 시간대(Clock.systemDefaultZone)를 따른다. 컨테이너 기본값 UTC를 쓰지 않는다.
      # 실행 이미지에 OS 시간대 데이터가 없어 셸의 date는 UTC로 보이지만, JVM은 자체 데이터로 -Duser.timezone(KST)을 쓴다(로그 +09:00).
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Seoul
    volumes:
      # 공유 링크 수집 결과(data/results)
      - app-data:/app/data
    healthcheck:
      # 실행 이미지(Playwright)에 curl·wget이 없어 bash /dev/tcp로 확인한다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    # 외부 포트를 열지 않는다. Caddy만 앞에서 받는다.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 넣으세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
