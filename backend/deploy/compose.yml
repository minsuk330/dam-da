# 서버 배포: Spring 앱 + PostgreSQL. 사용법은 docs/deploy.md.
# 이 디렉터리에서 실행한다.
# - 호스트에 nginx가 이미 있으면: docker compose up -d --build  (앱은 127.0.0.1:${APP_PORT}에서만 받는다, nginx.conf.example)
# - 80·443이 비어 있으면 Caddy까지: docker compose --profile caddy up -d --build
name: khack

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-review}
      POSTGRES_USER: ${DB_USERNAME:-review}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 외부 포트를 열지 않는다. 앱만 내부 네트워크로 접속한다.

  app:
    # APP_IMAGE를 GHCR 이미지로 두면 docker compose pull app으로 받아 쓴다(서버에서 빌드하지 않음).
    # 비워 두면 기존처럼 서버에서 빌드한다(docker compose up -d --build app).
    image: ${APP_IMAGE:-khack-app}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-review}
      # 매일 학습의 "오늘"·연속 학습 일수·알림 시각은 JVM 기본 시간대(Clock.systemDefaultZone)를 따른다. 컨테이너 기본값 UTC를 쓰지 않는다.
      # 실행 이미지에 OS 시간대 데이터가 없어 셸의 date는 UTC로 보이지만, JVM은 자체 데이터로 -Duser.timezone(KST)을 쓴다(로그 +09:00).
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Seoul
    ports:
      # 호스트의 리버스 프록시(nginx)만 접속하도록 루프백에만 연다.
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    volumes:
      # 공유 링크 수집 결과(data/results)
      - app-data:/app/data
      # 토스 로그인 mTLS 인증서(#149). 서버의 backend/certs/toss/에 두고 커밋하지 않는다(docs/deploy.md "토스 인앱").
      # 없으면 빈 폴더가 붙고 토스 로그인만 401이다. 쓰려면 .env의 TOSS_MTLS_CERT·TOSS_MTLS_KEY를 채운다.
      - ../certs/toss:/app/certs/toss:ro
    healthcheck:
      # 실행 이미지(Playwright)에 curl·wget이 없어 bash /dev/tcp로 확인한다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # 80·443을 쓰는 웹 서버가 없는 VPS에서만 쓴다(--profile caddy).
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
