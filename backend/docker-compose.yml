# 로컬 개발용 PostgreSQL. 접속 정보는 .env의 DB_* 값과 같아야 한다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-review}
      POSTGRES_USER: ${DB_USERNAME:-review}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-review}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
