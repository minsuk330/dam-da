server:
  port: 8080
  # Caddy·ngrok 뒤에서 https와 공개 호스트로 redirect URI를 만든다. Tomcat RemoteIpValve는 내부 프록시가 보낸 헤더만 믿는다.
  forward-headers-strategy: native
spring:
  application:
    name: review
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/review}
    username: ${DB_USERNAME:review}
    password: ${DB_PASSWORD:review}
  jpa:
    # 해커톤 단계는 엔티티 기준 자동 갱신. 운영 전 마이그레이션 도구로 바꾼다.
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}
    mcp:
      server:
        name: review-connector
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
springdoc:
  # /v3/api-docs, /swagger-ui. 기본은 꺼 두고 로컬에서만 켠다(배포 서버에 API 문서를 노출하지 않는다).
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  # 프론트엔드 계약은 /api/**만. /dev, /mcp, /healthz는 넣지 않는다.
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # frontend/openapi.json 비교가 순서에 흔들리지 않게 한다.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
review:
  llm:
    # 학습자가 기다리는 짧은 생성(힌트·개념 설명·선행 개념)에 보내는 reasoning_effort. 모델이 지원하는 값이어야 한다(gpt-6-luna: none·low·medium·high·xhigh)
    minimal-reasoning-effort: none
  auth:
    # false는 테스트 전용: /api/**를 열고 토큰 없는 요청을 데모 사용자로 처리한다.
    required: true
    # 이 서버의 공개 주소. 토큰 iss와 소셜 로그인 URL에 쓴다. 배포: https://hack.refit-100.site
    server-url: ${PUBLIC_SERVER_URL:http://localhost:8080}
    # 로그인 후 돌아갈 앱 주소. {app-url}/auth/callback?code=…
    app-url: ${APP_URL:http://localhost:8081}
    # 토큰 서명 키(PKCS#8 DER base64). 비면 임시 키라 재시작하면 로그인이 풀린다. AuthKeyConfig 참고.
    signing-key: ${AUTH_SIGNING_KEY:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      # REST API 키
      client-id: ${KAKAO_CLIENT_ID:}
      # 카카오 콘솔에서 Client Secret을 켰을 때만
      client-secret: ${KAKAO_CLIENT_SECRET:}
  cors:
    # 로컬 Expo 웹 개발 서버만. 배포 서버는 Vercel rewrites로 같은 출처라 비워 둔다(CORS_ALLOWED_ORIGINS=).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  dev-tools:
    # /dev/** (세션 뷰어, 시간 이동). 켜면 이 기기에서 직접 온 요청과, X-Dev-Token 헤더가 token과 같은 원격 요청만 허용한다.
    enabled: ${DEV_TOOLS_ENABLED:false}
    # 배포 서버에서 원격 데모용. 비어 있으면 원격 요청은 모두 막는다. 길고 무작위인 값을 쓰고 커밋하지 않는다.
    token: ${DEV_TOOLS_TOKEN:}
  demo-clock:
    # 앱 시연 도구의 서버 시계 이동(/api/demo/clock). 로그인한 사용자면 토큰 없이 쓴다. 시계는 서버 전체에 적용되므로 시연 기간에만 켠다.
    enabled: ${DEMO_CLOCK_ENABLED:false}
  demo-user:
    name: 지원
  analysis:
    # 복습 단위 검수 기준 (docs/jev.md). 실제 판정 분포를 보고 맞춘다.
    min-confidence: 0.5
    # 커넥터 입력(model_transcribed)은 기준을 더 높게 잡는다(스펙 §7.3).
    min-confidence-transcribed: 0.6
    # 복습 가치(noul) 확률이 이 구간이면 보류
    hold-band-low: 0.3
    hold-band-high: 0.7
    # 근거 연결 점수(0~1 환산) 통과 기준
    min-evidence-fit: 0.5
    # 429·529 재시도 (첫 호출 포함)
    max-attempts: 3
    retry-delay: 1s
    # 학습 분야 라벨 (스펙 §7.10). 기준은 sessionFieldCheck의 실제 분포로 맞춘다
    field:
      auto-classify: true
      # choice 신뢰도 기준. 1단계가 낮으면 미분류(etc.etc), 2단계가 낮으면 <대분류>.etc
      min-confidence: 0.5
      max-attempts: 3
      retry-delay: 1s
  question:
    # 문제 품질 검사 기준 (docs/jev.md). 실제 판정 분포를 보고 맞춘다.
    min-grounded: 0.7
    min-clarity: 0.5
    min-confidence: 0.5
    max-duplicate: 0.7
    # Jev 429·529 재시도 (첫 호출 포함)
    max-attempts: 3
    retry-delay: 1s
    # 문제 1개 자리에 생성을 시도하는 최대 횟수 (첫 시도 + 재생성 2회). 넘으면 그 항목 출제 보류
    max-generations: 3
    # 첫 학습 문제를 동시에 만드는 복습 단위 수, 동시에 하는 품질 검사(Jev) 수. 같은 기억 항목의 문제는 차례로 검사한다
    parallel-units: 4
    parallel-judges: 8
  practice:
    # 첫 학습 문제 상한 (스펙 §7.8)
    first-study-max-questions: 12
    # 이 시간 안에 고른 객관식 정답은 추측을 의심한다 (스펙 §6.4.5 변환표 행 3)
    mc-guess-threshold: 3s
    judge:
      # 답변 판정 이유(omission·contradiction·repeats_user_belief·off_target_error, 예/아니오 질문)는 확률만 있고 신뢰도가 없다.
      # 확률이 이 값 이상이면 그 이유가 있고, 이 값 이하이면 없다. 둘 사이는 확정하지 않고 애매하다고 기록한다(docs/jev.md).
      # 판정(verdict)·질문 오독(misread)의 신뢰도 기준은 등급 변환(review.memory.rating)이 적용한다
      reason-yes-min: 0.7
      reason-no-max: 0.3
      # Jev 429·529 재시도 (첫 호출 포함)
      max-attempts: 3
      retry-delay: 1s
    feedback:
      # 다음 행동 선택(Jev choice) 신뢰도 기준 (docs/jev.md). 낮으면 상태 기계의 기본 행동을 쓴다
      min-confidence: 0.5
      # Jev 429·529 재시도 (첫 호출 포함)
      max-attempts: 3
      retry-delay: 1s
      # 풀이 세션 하나에서 오늘 다시 묻기(첫 학습 확인 문제 포함)로 큐 끝에 넣을 수 있는 최대 개수 (하루 분량 상한)
      relearn-max-per-session: 5
      # 한 기억 항목에서 틀린 제시가 이만큼 쌓이면 반복 어려움으로 보고 선행 개념을 제안한다
      repeated-difficulty-presentations: 2
      # 힌트·개념 설명·선행 개념 생성(LLM)을 기다리는 최대 시간. 넘으면 문제에 저장된 기본 힌트·설명을 쓰고 선행 개념은 제안하지 않는다
      content-timeout: 4s
  memory:
    # 기억 강도를 정하기 전의 기본 목표 유지율 (스펙 §6.4.7)
    default-retention: 0.9
    # 기억 강도별 예상 하루 부담 시뮬레이션 기간과 복습 1회 예상 시간(분)
    simulation-days: 30
    minutes-per-review: 0.75
    # 개인 매개변수 (스펙 §6.4.9). min-reviews는 optimizer/의 --min-reviews 기본값과 같게 둔다
    personalization:
      min-reviews: 512
      curve-days: 30
    # 매일 학습 큐 (스펙 §6.4.4, §6.4.6). 문제 유형별 소요 시간은 아래 rating.reference-times를 쓴다
    daily:
      # 하루 시간 예산 (문제 유형별 기준 시간의 합)
      budget: 5m
      # 신규 항목 하루 상한
      max-new-items: 3
      # 우선순위 = (1 - R) x 가중치. 헷갈린 지점 > warning > fact·practice
      weights:
        CONFUSION: 3.0
        WARNING: 2.0
        FACT: 1.0
        PRACTICE: 1.0
      # 보류 항목의 최소 긴급도(보류는 기억 상태를 바꾸지 않아 R이 높을 수 있다)
      held-min-urgency: 0.5
      # 안정도 사다리 경계 (S, 일). 초기안
      ladder-level2-min-stability-days: 3
      ladder-level3-min-stability-days: 14
    rating:
      # 등급 변환표 행 1·2의 판정 신뢰도 기준 (스펙 §6.4.5). 자동 반영 여부를 정하는 초기 기준이며 Jev의 실제 채점 정확도를 뜻하지 않는다
      # 데모 기간 값. 측정(answerJudgeCheck)에서 표현이 다른 정답의 신뢰도가 0.64~0.83이라 0.80이면 정답 일부가 보류된다
      min-confidence: 0.7
      # 판정에 쓴 대화 근거가 모델이 옮겨 적은 것(model_transcribed)일 때의 기준 (스펙 §7.3). 원문 근거보다 높게 잡는다.
      # 검증하지 않은 초기값이다. 실제 풀이 기록(review_log.applied_min_confidence·evidence_transcribed)으로 보정한다
      min-confidence-transcribed: 0.8
      # 문제 유형별 기준 응답 시간. 응답 시간은 Easy를 막는 보조 조건으로만 쓴다
      reference-times:
        MULTIPLE_CHOICE: 20s
        SHORT_ANSWER: 40s
        ESSAY: 90s
        ERROR_FINDING: 60s
        CASE_JUDGMENT: 90s
        CASE_APPLICATION: 120s
      # 응답 시간이 기준의 이 배수 이하일 때만 Easy
      easy-max-time-ratio: 1.5
  engagement:
    reminder:
      # 매일 학습 알림 확인 (스펙 §7.7). 시각은 Clock 기준이라 시간 이동 뒤 다음 확인에서 반영된다
      enabled: true
      interval: 30s
  jev:
    api-key: ${TYPESAFE_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
logging:
  level:
    io.modelcontextprotocol: INFO
