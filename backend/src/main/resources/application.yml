server:
  port: 8080
spring:
  application:
    name: review
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/review}
    username: ${DB_USERNAME:review}
    password: ${DB_PASSWORD:review}
  jpa:
    # 해커톤 단계는 엔티티 기준 자동 갱신. 운영 전 마이그레이션 도구로 바꾼다.
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}
    mcp:
      server:
        name: review-connector
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
review:
  dev-tools:
    # /dev/** (세션 뷰어, 시간 이동). 켜면 이 기기에서 직접 온 요청과, X-Dev-Token 헤더가 token과 같은 원격 요청만 허용한다.
    enabled: ${DEV_TOOLS_ENABLED:false}
    # 배포 서버에서 원격 데모용. 비어 있으면 원격 요청은 모두 막는다. 길고 무작위인 값을 쓰고 커밋하지 않는다.
    token: ${DEV_TOOLS_TOKEN:}
  demo-user:
    name: 지원
  analysis:
    # 복습 단위 검수 기준 (docs/jev.md). 실제 판정 분포를 보고 맞춘다.
    min-confidence: 0.5
    # 커넥터 입력(model_transcribed)은 기준을 더 높게 잡는다(스펙 §7.3).
    min-confidence-transcribed: 0.6
    # 복습 가치(noul) 확률이 이 구간이면 보류
    hold-band-low: 0.3
    hold-band-high: 0.7
    # 근거 연결 점수(0~1 환산) 통과 기준
    min-evidence-fit: 0.5
    # 429·529 재시도 (첫 호출 포함)
    max-attempts: 3
    retry-delay: 1s
  question:
    # 문제 품질 검사 기준 (docs/jev.md). 실제 판정 분포를 보고 맞춘다.
    min-grounded: 0.7
    min-clarity: 0.5
    min-confidence: 0.5
    max-duplicate: 0.7
    # Jev 429·529 재시도 (첫 호출 포함)
    max-attempts: 3
    retry-delay: 1s
    # 문제 1개 자리에 생성을 시도하는 최대 횟수 (첫 시도 + 재생성 2회). 넘으면 그 항목 출제 보류
    max-generations: 3
  practice:
    # 첫 학습 문제 상한 (스펙 §7.8)
    first-study-max-questions: 12
    # 이 시간 안에 고른 객관식 정답은 추측을 의심한다 (스펙 §6.4.5 변환표 행 3)
    mc-guess-threshold: 3s
    judge:
      # 답변 판정 이유(omission·contradiction·misread 등 noul) 확률이 이 값 이상이면 그 이유가 있다고 본다.
      # 판정 신뢰도 기준은 등급 변환(review.memory.rating)이 적용한다
      failure-threshold: 0.5
      # Jev 429·529 재시도 (첫 호출 포함)
      max-attempts: 3
      retry-delay: 1s
  memory:
    # 기억 강도를 정하기 전의 기본 목표 유지율 (스펙 §6.4.7)
    default-retention: 0.9
    # 기억 강도별 예상 하루 부담 시뮬레이션 기간과 복습 1회 예상 시간(분)
    simulation-days: 30
    minutes-per-review: 0.75
    rating:
      # 등급 변환표 행 1·2의 판정 신뢰도 기준 (스펙 §6.4.5)
      min-confidence: 0.6
      # 문제 유형별 기준 응답 시간. 응답 시간은 Easy를 막는 보조 조건으로만 쓴다
      reference-times:
        MULTIPLE_CHOICE: 20s
        SHORT_ANSWER: 40s
        ESSAY: 90s
        ERROR_FINDING: 60s
        CASE_JUDGMENT: 90s
        CASE_APPLICATION: 120s
      # 응답 시간이 기준의 이 배수 이하일 때만 Easy
      easy-max-time-ratio: 1.5
  jev:
    api-key: ${TYPESAFE_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
logging:
  level:
    io.modelcontextprotocol: INFO
