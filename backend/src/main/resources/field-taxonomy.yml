  - code: etc
    label: 기타
    subfields:
      - { code: etc.career, label: 취업·자격증, hint: "면접, 자기소개서, 자격시험 준비 일반" }
      - { code: etc.life, label: 생활·교양, hint: "시사, 상식, 재테크 입문, 생활 지식" }
