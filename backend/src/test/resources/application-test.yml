# ./gradlew test 전용. Docker 없이 H2(PostgreSQL 모드)로 실행한다.
spring:
  datasource:
    url: jdbc:h2:mem:review-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
springdoc:
  api-docs:
    enabled: true
review:
  auth:
    # 기존 테스트는 토큰 없이 데모 사용자로 돈다. 인증 동작은 AuthIT가 required=true로 확인한다.
    required: false
    google:
      client-id: ""
    kakao:
      client-id: ""
  dev-tools:
    enabled: true
  # 힌트·설명 생성 시간 상한. 느린 생성기 테스트가 오래 걸리지 않게 줄인다
  practice:
    feedback:
      content-timeout: 1s
  # 분야 자동 판정은 FakeJevPort 응답 순서를 흐트러뜨리므로 끈다. SessionFieldServiceIT만 켠다
  analysis:
    field:
      auto-classify: false
  # backend/.env에 키가 있어도 테스트는 실제 Jev를 부르지 않는다. 검수는 UNAVAILABLE로 끝난다.
  jev:
    api-key: ""
  # 테스트는 매일 학습 알림을 직접 호출한다
  engagement:
    reminder:
      enabled: false
